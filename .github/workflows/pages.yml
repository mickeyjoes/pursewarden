# Deploys the read-only Attack Lab to GitHub Pages (custom domain https://pursewarden.com).
# Runs on manual dispatch, or on a push to master that changes the site, the evidence or the code the
# bundle is replayed through (paths below). Actions are pinned by commit SHA.
# Settings -> Pages -> Source is "GitHub Actions"; the custom domain lives in that setting.
name: pages
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pages.yml"
      - "web/**"
      - "evidence/**"
      - "packages/**"
      - "scripts/build_web_bundle.py"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify the bundle is reproducible from committed raw RPC
        run: |
          python3 scripts/build_web_bundle.py
          git diff --exit-code web/public/bundle.json
      - name: Build
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
